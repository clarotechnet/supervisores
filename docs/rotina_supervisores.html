<body>
<main class="app">
  <aside class="side">
    <div class="brand"><div class="logo">R</div><div><strong>Rotina</strong><small>Supervisores</small></div></div>
    <div class="label">Áreas operacionais</div><nav id="areas" class="areas"></nav>
    <div class="side-progress"><span>Progresso do dia</span><strong id="sidePct">0%</strong><div class="bar"><i id="sideBar"></i></div><small id="sideText">0 atividades concluídas</small></div>
  </aside>
  <section class="workspace">
    <header class="top">
      <div class="mobile-title"><span>R</span> Rotina</div>
      <div class="date"><button class="arrow" id="prev" aria-label="Dia anterior">‹</button><div class="date-copy"><span class="eyebrow">Plano do dia</span><b id="dateLabel"></b></div><button class="arrow" id="next" aria-label="Próximo dia">›</button><button class="today" id="today">Hoje</button></div>
      <div class="top-actions"><button class="notify" id="notify">Ativar lembretes</button><div class="avatar" id="avatar">NTL</div></div>
    </header>
    <div class="content">
      <section class="hero"><div><span class="eyebrow" id="subtitle"></span><h1 id="areaName"></h1><p id="heroMessage"></p></div><div class="hero-stat"><div class="ring" id="ring"><b id="ringPct">0%</b></div><div><b id="heroCount">0/0</b><small>concluídas</small></div></div></section>
      <div class="alert" id="alert"><span id="alertText"></span><button id="dismissAlert">×</button></div>
      <section class="summary"><article><span class="ico total">◆</span><div><small>Total do dia</small><b id="total">0</b></div></article><article><span class="ico late">!</span><div><small>Em atraso</small><b id="late">0</b></div></article><article><span class="ico wait">◷</span><div><small>Pendentes</small><b id="pending">0</b></div></article><article><span class="ico ok">✓</span><div><small>Concluídas</small><b id="done">0</b></div></article></section>
      <div class="toolbar"><div class="tabs"><button class="on" data-view="board">Quadro</button><button data-view="list">Lista</button><button data-view="history">Histórico</button></div><span class="sync"><i></i> Salvo automaticamente</span></div>
      <div id="view"></div>

  </section>
</main>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateFrom=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
let areaId=localStorage.getItem('rotina:area')||'natal',dateKey=key(new Date()),view='board',noteId=null,alerted=new Set();
const area=()=>AREAS.find(a=>a.id===areaId)||AREAS[0];
const dayTasks=(a=area(),k=dateKey)=>a.tasks.filter(x=>!x.days||x.days.includes(dateFrom(k).getDay()));
const storeKey=(a=areaId,k=dateKey)=>`rotina:${a}:${k}`;
const read=(a=areaId,k=dateKey)=>{try{return JSON.parse(localStorage.getItem(storeKey(a,k))||'{}')}catch{return {}}};
const write=s=>localStorage.setItem(storeKey(),JSON.stringify(s));
function status(task,s,k=dateKey){if(s?.done)return'done';const d=dateFrom(k),[h,m]=task.time.split(':').map(Number);d.setHours(h,m,0,0);return d<new Date()?'late':'pending'}
function esc(v=''){return v.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function taskCard(x,s){const st=status(x,s);return `<article class="card ${st}"><button class="check" data-toggle="${x.id}" aria-label="${s?.done?'Reabrir':'Concluir'} atividade">${s?.done?'✓':''}</button><div class="copy"><div class="meta"><span class="time">${x.time}</span><span class="group">${x.group}</span></div><h3>${x.title}</h3><div class="card-foot"><span class="complete-time">${s?.doneAt?'Concluída às '+s.doneAt:''}</span><button class="note-btn" data-note="${x.id}">${s?.note?'● Observação':'＋ Observação'}</button></div></div></article>`}
function render(){
 const a=area(),tasks=dayTasks(),saved=read();document.documentElement.style.setProperty('--area',a.color);
 $('#areas').innerHTML=AREAS.map(x=>`<button class="area ${x.id===areaId?'on':''}" style="--c:${x.color}" data-area="${x.id}"><span class="code">${x.code}</span><span><b>${x.name}</b><small>${x.subtitle}</small></span>${x.id===areaId?'<i class="dot"></i>':''}</button>`).join('');
 $('#dateLabel').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long'}).format(dateFrom(dateKey));$('#today').style.display=dateKey===key(new Date())?'none':'';$('#avatar').textContent=a.code;$('#subtitle').textContent=a.subtitle;$('#areaName').textContent=a.name;
 const buckets={pending:[],late:[],done:[]};tasks.forEach(x=>buckets[status(x,saved[x.id])].push(x));const pct=tasks.length?Math.round(buckets.done.length/tasks.length*100):0;
 $('#sidePct').textContent=pct+'%';$('#sideBar').style.width=pct+'%';$('#sideText').textContent=`${buckets.done.length} de ${tasks.length} atividades concluídas`;$('#ring').style.setProperty('--p',pct*3.6+'deg');$('#ringPct').textContent=pct+'%';$('#heroCount').textContent=`${buckets.done.length}/${tasks.length}`;
 $('#total').textContent=tasks.length;$('#late').textContent=buckets.late.length;$('#pending').textContent=buckets.pending.length;$('#done').textContent=buckets.done.length;$('#heroMessage').textContent=buckets.late.length?`${buckets.late.length} atividade${buckets.late.length>1?'s':''} precisa${buckets.late.length>1?'m':''} de atenção.`:'Rotina em dia. Continue acompanhando as próximas atividades.';
 const alert=$('#alert');if(buckets.late.length&&dateKey===key(new Date())&&!sessionStorage.getItem('rotina:dismiss:'+areaId)){alert.classList.add('show');$('#alertText').textContent=`⚠ ${buckets.late.length} atividade${buckets.late.length>1?'s estão':' está'} atrasada${buckets.late.length>1?'s':''}. Conclua ou registre uma observação.`}else alert.classList.remove('show');
 if(!tasks.length)$('#view').innerHTML=`<section class="empty-day"><span>☕</span><h2>Sem atividades programadas</h2><p>Não há rotina cadastrada para este dia nesta área.</p></section>`;
 else if(view==='board')$('#view').innerHTML=`<section class="board">${[['pending','Pendentes'],['late','Em atraso'],['done','Concluídas']].map(([st,label])=>`<div class="column ${st}"><div class="col-title"><div><i></i><b>${label}</b></div><span class="count">${buckets[st].length}</span></div><div class="cards">${buckets[st].map(x=>taskCard(x,saved[x.id])).join('')||'<div class="empty-col">Nenhuma atividade aqui</div>'}</div></div>`).join('')}</section>`;
 else if(view==='list')$('#view').innerHTML=`<section class="list">${tasks.map(x=>taskCard(x,saved[x.id])).join('')}</section>`;else renderHistory();
 $$('.area').forEach(b=>b.onclick=()=>{areaId=b.dataset.area;localStorage.setItem('rotina:area',areaId);sessionStorage.removeItem('rotina:dismiss:'+areaId);render()});$$('[data-toggle]').forEach(b=>b.onclick=()=>toggle(b.dataset.toggle));$$('[data-note]').forEach(b=>b.onclick=()=>openNote(b.dataset.note));
}
function toggle(id){const s=read(),done=s[id]?.done;s[id]={...s[id],done:!done,doneAt:!done?new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):undefined};write(s);toast(!done?'Atividade concluída.':'Atividade reaberta.');render()}
function renderHistory(){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=key(d),tasks=dayTasks(area(),k),saved=read(areaId,k),done=tasks.filter(x=>saved[x.id]?.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;days.push(`<article class="day-history"><small>${new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(d)}</small><b>${pct}%</b><span>${done} de ${tasks.length}</span><div class="history-bar"><i style="width:${pct}%"></i></div></article>`)}$('#view').innerHTML=`<section class="history">${days.join('')}</section><p class="history-note">Histórico dos últimos 7 dias desta área. Os dados ficam salvos neste navegador.</p>`}
function openNote(id){noteId=id;const x=dayTasks().find(t=>t.id===id),s=read();$('#noteTitle').textContent=x?.title||'';$('#noteText').value=s[id]?.note||'';$('#noteDialog').showModal()}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.remove('show'),2600)}
async function notifications(){if(!('Notification'in window)){toast('Este navegador não oferece notificações.');return}const p=await Notification.requestPermission();if(p==='granted'){localStorage.setItem('rotina:notifications','on');$('#notify').textContent='Lembretes ativos';toast('Lembretes ativados.')}else toast('Permissão de notificação não concedida.')}
function checkAlerts(){if(dateKey!==key(new Date()))return;const s=read(),late=dayTasks().filter(x=>status(x,s[x.id])==='late');late.forEach(x=>{const k=areaId+':'+dateKey+':'+x.id;if(!alerted.has(k)){alerted.add(k);if(localStorage.getItem('rotina:notifications')==='on'&&Notification.permission==='granted')new Notification('Rotina Supervisores',{body:`${x.time} · ${x.title} ainda não foi concluída.`})}})}
$('#prev').onclick=()=>{const d=dateFrom(dateKey);d.setDate(d.getDate()-1);dateKey=key(d);render()};$('#next').onclick=()=>{const d=dateFrom(dateKey);d.setDate(d.getDate()+1);dateKey=key(d);render()};$('#today').onclick=()=>{dateKey=key(new Date());render()};$('#notify').onclick=notifications;$('#dismissAlert').onclick=()=>{sessionStorage.setItem('rotina:dismiss:'+areaId,'1');$('#alert').classList.remove('show')};$$('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.view;$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});$('#cancelNote').onclick=()=>$('#noteDialog').close();$('#saveNote').onclick=()=>{const s=read();s[noteId]={...s[noteId],done:s[noteId]?.done||false,note:$('#noteText').value.trim()};write(s);$('#noteDialog').close();toast('Observação salva.');render()};$('#noteDialog').addEventListener('click',e=>{if(e.target===$('#noteDialog'))$('#noteDialog').close()});
if(localStorage.getItem('rotina:notifications')==='on'&&'Notification'in window&&Notification.permission==='granted')$('#notify').textContent='Lembretes ativos';render();checkAlerts();setInterval(checkAlerts,60000);
</script>
